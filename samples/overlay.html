<!DOCTYPE html>
<!-- Corner status widget demo. Try:
     curl -X POST --data-binary @samples/overlay.html "http://TV_IP:8080/overlay?x=62%&y=8%&w=34%&h=26%"
     (encode % as %25 in a real URL) -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: flex-start; justify-content: flex-end;
    font-family: sans-serif; color: #fff;
  }
  .card {
    width: 92%; padding: 4% 5%;
    border-radius: 18px;
    background: rgba(16, 24, 32, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    animation: slideIn .45s ease-out;
  }
  .title { font-size: 3.2vmin; font-weight: 700; letter-spacing: .04em; }
  .title span { color: #ff5252; }
  .clock { font-size: 7vmin; font-weight: 300; margin: 1% 0; font-variant-numeric: tabular-nums; }
  .sub   { font-size: 2.4vmin; opacity: .75; }
  .bar   { height: 4px; border-radius: 2px; margin-top: 3%;
           background: linear-gradient(90deg, #ff5252, #ffb300, #40c4ff);
           animation: pulse 2.2s ease-in-out infinite; }
  @keyframes slideIn { from { transform: translateY(-16px); opacity: 0; } }
  @keyframes pulse   { 50% { opacity: .35; } }
</style>
</head>
<body>
  <div class="card">
    <div class="title"><span>●</span> atv_overlay</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="sub">rendered from raw HTML over your TV app</div>
    <div class="bar"></div>
  </div>
  <script>
    const el = document.getElementById('clock');
    const tick = () => el.textContent = new Date().toLocaleTimeString();
    tick(); setInterval(tick, 250);
  </script>
</body>
</html>
